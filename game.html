<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Games - Portfolio</title>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">GAMEDEV</a>
            <ul class="nav-links">
                <li><a href="index.html">HOME</a></li>
                <li><a href="games.html" class="active">GAMES</a></li>
                <li><a href="about.html">ABOUT</a></li>
                <li><a href="contact.html">CONTACT</a></li>

            <p class="page-subtitle">A collection of interactive experiences</p>
        </div>
    </section>

    <section class="projects-section">
        <div class="container">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="Unity">Unity</button>
                <button class="filter-btn" data-filter="VR">VR</button>
                <button class="filter-btn" data-filter="Mobile">Mobile</button>
            </div>
            
            <div class="projects-grid" id="projectsGrid"></div>
        </div>
    </section>

    <div id="projectModal" class="modal">
        <div class="modal-overlay" onclick="closeProjectModal()"></div>
        <div class="modal-content">
            <button class="modal-close" onclick="closeProjectModal()">&times;</button>
            <div id="modalBody"></div>

        <div class="container">
            <div class="social-links">
